# External Traefik deployment: Postgres + API + Web only.
# Assumes Traefik and Redis are already running on the host.
#
# Required environment variables:
#   AUTH_JWT_SECRET (min 32 chars)
#   STATIC_CRON_TOKEN
#
# Optional:
#   DOMAIN           — your domain (default: localhost)
#   DB_DATABASE      — postgres database name (default: gofin)
#   DB_USERNAME      — postgres user (default: gofin)
#   DB_PASSWORD      — postgres password (default: gofin_secret)
#   ADMIN_EMAIL      — auto-create admin user on first boot
#   ADMIN_PASSWORD   — admin password (default: random)
#   REDIS_HOST       — external Redis host (default: redis — set to your Redis address)
#   REDIS_PORT       — external Redis port (default: 6379)
#   DOCKER_IMAGE_API — override API image (default: ghcr.io/ajianaz/gofin-api:develop)
#   DOCKER_IMAGE_WEB — override Web image (default: ghcr.io/ajianaz/gofin-web:develop)
#
# Usage:
#   docker compose -f deployments/docker/docker-compose.traefik.yml up -d
#
# Traefik labels are based on the common pattern:
#   - API served at <domain>/api/* and /health
#   - Web served at <domain>/*
#   - SSE endpoint /api/v1/notifications/stream with flush support

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-traefik-labels-api: &traefik-api
  traefik.enable: "true"
  traefik.http.routers.gofin-api.rule: "Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/metrics`))"
  traefik.http.routers.gofin-api.entrypoints: websecure
  traefik.http.routers.gofin-api.tls: "true"
  traefik.http.routers.gofin-api.priority: "10"
  traefik.http.routers.gofin-api.service: gofin-api
  traefik.http.services.gofin-api.loadbalancer.server.port: "8080"
  # SSE: disable response buffering for streaming endpoints
  traefik.http.middlewares.gofin-sse.buffering.maxResponseBodyBytes: "0"
  traefik.http.routers.gofin-api.middlewares: "gofin-sse@docker"

x-traefik-labels-web: &traefik-web
  traefik.enable: "true"
  traefik.http.routers.gofin-web.rule: "Host(`${DOMAIN:-localhost}`)"
  traefik.http.routers.gofin-web.entrypoints: websecure
  traefik.http.routers.gofin-web.tls: "true"
  traefik.http.routers.gofin-web.priority: "1"
  traefik.http.services.gofin-web.loadbalancer.server.port: "3000"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gofin}
      POSTGRES_USER: ${DB_USERNAME:-gofin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gofin_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gofin} -d ${DB_DATABASE:-gofin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gofin-internal

  app:
    image: ${DOCKER_IMAGE_API:-ghcr.io/ajianaz/gofin-api:develop}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: https://${DOMAIN:-localhost}
      TZ: ${TZ:-UTC}
      HTTP_PORT: "8080"
      HTTP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-gofin}
      DB_USERNAME: ${DB_USERNAME:-gofin}
      DB_PASSWORD: ${DB_PASSWORD:-gofin_secret}
      DB_SSL_MODE: disable
      DB_DSN: postgres://${DB_USERNAME:-gofin}:${DB_PASSWORD:-gofin_secret}@postgres:5432/${DB_DATABASE:-gofin}?sslmode=disable
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-5}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-2}
      DB_CONN_MAX_LIFETIME: 300
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTH_PROVIDER: local
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set (min 32 chars)}
      AUTH_JWT_EXPIRY_MINUTES: 60
      AUTH_REFRESH_EXPIRY_DAYS: 30
      AUTH_ALLOW_REGISTRATION: "${AUTH_ALLOW_REGISTRATION:-false}"
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN:?STATIC_CRON_TOKEN must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_SECONDS: 60
      MAX_REQUEST_BODY_BYTES: 10485760
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
      DISABLE_PROMETHEUS: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gofin-internal
      - traefik-public
    labels:
      <<: *traefik-api

  web:
    image: ${DOCKER_IMAGE_WEB:-ghcr.io/ajianaz/gofin-web:develop}
    environment:
      ORIGIN: https://${DOMAIN:-localhost}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - gofin-internal
      - traefik-public
    labels:
      <<: *traefik-web

volumes:
  postgres_data:

networks:
  gofin-internal:
    driver: bridge
  traefik-public:
    external: true
