name: Publish Docker Images

on:
  push:
    branches: [develop, main]
    tags: ['v*']
    paths:
      - 'api/**'
      - 'web/**'
      - 'deployments/docker/Dockerfile.*'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

# Only one publish at a time
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # Stage 1: Build per-arch on native runners (parallel)
  build:
    name: Build (${{ matrix.target }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: DockerHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            dockerfile: deployments/docker/Dockerfile.api
            context: api
            dockerhub: ajianaz/gofin-api
            ghcr: ghcr.io/ajianaz/gofin-api
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - target: api
            dockerfile: deployments/docker/Dockerfile.api
            context: api
            dockerhub: ajianaz/gofin-api
            ghcr: ghcr.io/ajianaz/gofin-api
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - target: web
            dockerfile: deployments/docker/Dockerfile.web
            context: web
            dockerhub: ajianaz/gofin-web
            ghcr: ghcr.io/ajianaz/gofin-web
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - target: web
            dockerfile: deployments/docker/Dockerfile.web
            context: web
            dockerhub: ajianaz/gofin-web
            ghcr: ghcr.io/ajianaz/gofin-web
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            BRANCH="develop"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BRANCH="latest"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BRANCH="${{ github.ref_name }}"
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ matrix.dockerhub }}:${{ steps.tag.outputs.branch }}-${{ matrix.arch }}
            ${{ matrix.dockerhub }}:${{ steps.tag.outputs.sha }}-${{ matrix.arch }}
            ${{ matrix.ghcr }}:${{ steps.tag.outputs.branch }}-${{ matrix.arch }}
            ${{ matrix.ghcr }}:${{ steps.tag.outputs.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }},mode=max

  # Stage 2: Merge into multi-arch manifest (both registries)
  manifest:
    name: Manifest (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: build
    environment: DockerHub
    strategy:
      matrix:
        include:
          - target: api
            dockerhub: ajianaz/gofin-api
            ghcr: ghcr.io/ajianaz/gofin-api
          - target: web
            dockerhub: ajianaz/gofin-web
            ghcr: ghcr.io/ajianaz/gofin-web

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            BRANCH="develop"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BRANCH="latest"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            BRANCH="${TAG}"
            VERSION="${TAG#v}"
            MAJOR_MINOR=$(echo "${VERSION}" | sed 's/\([0-9]*\.[0-9]*\).*/\1/')
            echo "extra_tags=${VERSION},${MAJOR_MINOR}" >> $GITHUB_OUTPUT
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create multi-arch manifest (Docker Hub)
        run: |
          TAGS="-t ${{ matrix.dockerhub }}:${{ steps.tag.outputs.branch }} \
                 -t ${{ matrix.dockerhub }}:${{ steps.tag.outputs.sha }}"
          if [ -n "${{ steps.tag.outputs.extra_tags }}" ]; then
            for t in $(echo "${{ steps.tag.outputs.extra_tags }}" | tr ',' ' '); do
              TAGS="$TAGS -t ${{ matrix.dockerhub }}:${t}"
            done
          fi
          docker buildx imagetools create ${TAGS} \
            ${{ matrix.dockerhub }}:${{ steps.tag.outputs.branch }}-amd64 \
            ${{ matrix.dockerhub }}:${{ steps.tag.outputs.branch }}-arm64

      - name: Create multi-arch manifest (GHCR)
        continue-on-error: true
        run: |
          TAGS="-t ${{ matrix.ghcr }}:${{ steps.tag.outputs.branch }} \
                 -t ${{ matrix.ghcr }}:${{ steps.tag.outputs.sha }}"
          if [ -n "${{ steps.tag.outputs.extra_tags }}" ]; then
            for t in $(echo "${{ steps.tag.outputs.extra_tags }}" | tr ',' ' '); do
              TAGS="$TAGS -t ${{ matrix.ghcr }}:${t}"
            done
          fi
          docker buildx imagetools create ${TAGS} \
            ${{ matrix.ghcr }}:${{ steps.tag.outputs.branch }}-amd64 \
            ${{ matrix.ghcr }}:${{ steps.tag.outputs.branch }}-arm64

      - name: Verify Docker Hub manifest
        run: |
          docker buildx imagetools inspect ${{ matrix.dockerhub }}:${{ steps.tag.outputs.branch }}

  # Stage 3: Security scanning with Trivy
  scan:
    name: Trivy Scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: manifest
    strategy:
      matrix:
        include:
          - target: api
            image: ajianaz/gofin-api
          - target: web
            image: ajianaz/gofin-web

    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            BRANCH="develop"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BRANCH="latest"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BRANCH="${{ github.ref_name }}"
          fi
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: "${{ matrix.image }}:${{ steps.tag.outputs.branch }}"
          format: "sarif"
          output: "trivy-${{ matrix.target }}-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-${{ matrix.target }}-results.sarif"
          category: "trivy-${{ matrix.target }}"

      - name: Trivy summary table
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: "${{ matrix.image }}:${{ steps.tag.outputs.branch }}"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"
          ignore-unfixed: true
