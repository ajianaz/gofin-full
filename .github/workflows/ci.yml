name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-build:
    name: API Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum
      - name: Build
        working-directory: api
        run: go build ./...
      - name: Vet
        working-directory: api
        run: go vet ./...

  api-unit-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum
      - name: Run unit tests
        working-directory: api
        run: go test ./tests/unit/... -count=1 -v

  api-lint:
    name: API Lint (golangci-lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: api
          version: latest

  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: [api-build]
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gofin_test
          POSTGRES_USER: gofin
          POSTGRES_PASSWORD: testpass
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_DATABASE: gofin_test
      DB_USERNAME: gofin
      DB_PASSWORD: testpass
      DB_SSL_MODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      AUTH_PROVIDER: disabled
      AUTH_JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Run integration tests
        run: go test ./tests/integration/... -v -timeout 60s

  web-check:
    name: Web Type Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Type check
        working-directory: web
        run: bun run check
      - name: Lint
        working-directory: web
        run: bun run lint

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [api-build, api-unit-tests, api-lint, web-check]
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        if: matrix.target == 'api'
        run: docker build -f deployments/docker/Dockerfile.api -t gofin-api ./api
      - name: Build Web image
        if: matrix.target == 'web'
        run: docker build -f deployments/docker/Dockerfile.web -t gofin-web ./web
