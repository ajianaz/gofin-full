name: Deploy to Server

on:
  workflow_run:
    workflows: ["Publish Docker Images"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OCI server
    runs-on: ubuntu-latest
    environment: OCI
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key

      - name: Deploy via SSH
        run: |
          SSH_CMD="ssh -o StrictHostKeyChecking=no -T -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          echo "=== Pulling latest images ==="
          $SSH_CMD "cd ${{ secrets.DEPLOY_PATH }} && docker compose pull"

          echo "=== Restarting services ==="
          $SSH_CMD "cd ${{ secrets.DEPLOY_PATH }} && docker compose down && docker compose up -d"

          echo "=== Waiting for health check ==="
          $SSH_CMD "for i in \$(seq 1 30); do
            if wget -q -O /dev/null http://localhost:8080/health 2>/dev/null; then
              echo '✅ API is healthy'
              exit 0
            fi
            echo \"  attempt \$i/30...\"
            sleep 2
          done
          echo '❌ API health check timeout'
          exit 1"

          echo "=== Showing status ==="
          $SSH_CMD "cd ${{ secrets.DEPLOY_PATH }} && docker compose ps"

          echo "=== Deploy complete ==="
